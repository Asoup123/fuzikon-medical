<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留言板｜富致康醫療器材</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263238;background:#f7fafb}a{text-decoration:none}
header{min-height:82px;padding:12px 7%;display:flex;justify-content:space-between;align-items:center;background:#fff;box-shadow:0 3px 18px #0000000f;position:sticky;top:0;z-index:10}.brand{color:#0797d3;font-size:22px;font-weight:800}.back{color:#0797d3;font-weight:800}
main{max-width:1120px;margin:auto;padding:60px 24px 90px}.title{text-align:center;margin-bottom:34px}.title span{color:#0797d3;font-size:13px;font-weight:800;letter-spacing:1.5px}.title h1{margin:8px 0 0;color:#17465c;font-size:36px}
.form-card,.message-card{background:#fff;border:1px solid #e1eaee;border-radius:14px}.form-card{padding:28px;margin-bottom:34px}.form-grid{display:grid;grid-template-columns:260px 1fr;gap:18px}.field label{display:block;margin-bottom:8px;color:#17465c;font-weight:800}.field input,.field textarea{width:100%;padding:13px 14px;border:1px solid #cfdee5;border-radius:9px;font:inherit}.field textarea{min-height:130px;resize:vertical}.submit{margin-top:18px;border:0;border-radius:8px;padding:12px 22px;background:#0797d3;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:10px;color:#176182}
.list{display:grid;gap:16px}.message-card{padding:22px}.meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;color:#78909c;font-size:13px}.name{color:#17465c;font-weight:800}.text{white-space:pre-wrap;line-height:1.8;color:#536b76}.reply{margin-top:16px;padding:15px 17px;background:#eef8fc;border-radius:10px;line-height:1.75;color:#46636f}.reply strong{display:block;color:#0797d3;margin-bottom:5px}.empty{text-align:center;color:#78909c;padding:30px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}header{padding:12px 5%}.brand{font-size:18px}main{padding:42px 18px 70px}}
</style></head><body>
<header><a class="brand" href="index.html">富致康醫療器材</a><a class="back" href="index.html">回到首頁</a></header>
<main><div class="title"><span>MESSAGE BOARD</span><h1>留言板</h1></div>
<section class="form-card"><form id="form"><div class="form-grid"><div class="field"><label>姓名／稱呼</label><input id="name" maxlength="40" required placeholder="請輸入姓名或稱呼"></div><div class="field"><label>留言內容</label><textarea id="message" maxlength="500" required placeholder="請輸入您的問題或留言"></textarea></div></div><button class="submit" type="submit">送出留言</button><div class="status" id="status"></div></form></section>
<section class="list" id="list"><div class="empty">留言載入中…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://sdkgiedglmhmchiietru.supabase.co","sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt=v=>new Date(v).toLocaleDateString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit"});
async function load(){const host=document.getElementById("list");const {data,error}=await db.from("guestbook_messages").select("id,name,message,reply,created_at").eq("is_public",true).order("created_at",{ascending:false});if(error||!data?.length){host.innerHTML='<div class="empty">目前尚無公開留言</div>';return}host.innerHTML=data.map(x=>`<article class="message-card"><div class="meta"><span class="name">${esc(x.name)}</span><span>${fmt(x.created_at)}</span></div><div class="text">${esc(x.message)}</div>${x.reply?`<div class="reply"><strong>富致康回覆</strong>${esc(x.reply)}</div>`:""}</article>`).join("")}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const name=document.getElementById("name").value.trim(),message=document.getElementById("message").value.trim(),status=document.getElementById("status");status.textContent="留言送出中…";const {error}=await db.from("guestbook_messages").insert({name,message,is_public:false});if(error){status.textContent="留言目前無法送出，請稍後再試。";return}e.target.reset();status.textContent="留言已送出，經確認後會顯示於留言板。"});
load();</script></body></html>
