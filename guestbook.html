<!doctype html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>留言板｜富致康醫療器材</title>

<style>

/* =========================
   基本設定
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#263238;
  background:#f7fafb;
}

a{
  text-decoration:none;
}


/* =========================
   Header
========================= */

header{
  width:100%;
  height:82px;
  background:#fff;
  border-bottom:1px solid #edf2f4;
}

.header-inner{
  width:88%;
  max-width:1600px;
  height:100%;
  margin:0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:24px;
}


/* Logo + 品牌名稱 */

.brand{
  display:flex;
  align-items:center;
  gap:20px;

  min-width:0;
}

.brand-logo{
  display:block;

  width:auto;
  height:66px;

  object-fit:contain;
  flex:none;
}

.brand-name{
  color:#0797d3;

  font-size:26px;
  font-weight:800;

  white-space:nowrap;
}


/* 回首頁按鈕 */

.back{
  flex:none;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:52px;

  padding:0 24px;

  border-radius:9px;

  background:#0797d3;
  color:#fff;

  font-size:18px;
  font-weight:800;

  transition:
    background .2s ease,
    transform .2s ease;
}

.back:hover{
  background:#0788be;
  transform:translateY(-1px);
}


/* =========================
   主內容
========================= */

main{
  width:100%;
  max-width:1120px;

  margin:0 auto;

  padding:60px 24px 90px;

  min-width:0;
}


/* =========================
   標題
========================= */

.title{
  text-align:center;
  margin-bottom:34px;
}

.title span{
  color:#0797d3;

  font-size:13px;
  font-weight:800;

  letter-spacing:1.5px;
}

.title h1{
  margin:8px 0 0;

  color:#17465c;

  font-size:36px;
}


/* =========================
   留言表單
========================= */

.form-card,
.message-card{
  width:100%;
  max-width:100%;

  min-width:0;

  background:#fff;

  border:1px solid #e1eaee;
  border-radius:14px;
}

.form-card{
  padding:28px;
  margin-bottom:34px;
}

.form-grid{
  display:grid;

  grid-template-columns:260px minmax(0,1fr);

  gap:18px;

  min-width:0;
}

.field{
  min-width:0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:#17465c;

  font-weight:800;
}

.field input,
.field textarea{
  display:block;

  width:100%;
  max-width:100%;

  min-width:0;

  padding:13px 14px;

  border:1px solid #cfdee5;
  border-radius:9px;

  background:#fff;

  font:inherit;

  outline:none;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

.field input:focus,
.field textarea:focus{
  border-color:#0797d3;
  box-shadow:0 0 0 3px rgba(7,151,211,.08);
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.submit{
  margin-top:18px;

  border:0;
  border-radius:8px;

  padding:12px 22px;

  background:#0797d3;
  color:#fff;

  font-weight:800;

  cursor:pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.submit:hover{
  background:#0788be;
  transform:translateY(-1px);
}

.status{
  margin-top:10px;

  color:#176182;

  line-height:1.6;

  overflow-wrap:anywhere;
  word-break:break-word;
}


/* =========================
   留言列表
========================= */

.list{
  display:grid;

  width:100%;

  min-width:0;

  gap:16px;
}


/* 單則留言 */

.message-card{
  padding:22px;

  overflow:hidden;
}


/* 姓名 + 日期 */

.meta{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:16px;

  min-width:0;

  margin-bottom:12px;

  color:#78909c;

  font-size:13px;
}

.name{
  min-width:0;

  color:#17465c;

  font-weight:800;

  overflow-wrap:anywhere;
  word-break:break-word;
}


/* =========================
   留言文字
========================= */

.text{
  width:100%;
  max-width:100%;

  min-width:0;

  color:#536b76;

  font-size:15px;

  line-height:1.8;

  white-space:pre-wrap;

  /*
    關鍵：
    超長數字、英文、網址全部強制換行
  */
  overflow-wrap:anywhere;
  word-break:break-word;
}


/* =========================
   富致康回覆
========================= */

.reply{
  width:100%;
  max-width:100%;

  min-width:0;

  margin-top:16px;

  padding:16px 18px;

  background:#eef8fc;

  border-radius:10px;

  color:#46636f;

  font-size:15px;

  line-height:1.75;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
  word-break:break-word;
}

.reply strong{
  display:block;

  margin-bottom:6px;

  color:#0797d3;

  font-weight:800;
}


/* =========================
   空留言
========================= */

.empty{
  width:100%;

  padding:30px;

  text-align:center;

  color:#78909c;

  overflow-wrap:anywhere;
}


/* =========================
   平板
========================= */

@media(max-width:900px){

  .header-inner{
    width:92%;
  }

  .brand-logo{
    height:58px;
  }

  .brand-name{
    font-size:23px;
  }

}


/* =========================
   手機
========================= */

@media(max-width:700px){

  header{
    height:70px;
  }

  .header-inner{
    width:92%;

    gap:12px;
  }

  .brand{
    gap:10px;
  }

  .brand-logo{
    height:48px;
  }

  .brand-name{
    font-size:18px;
  }

  .back{
    min-height:42px;

    padding:0 15px;

    border-radius:8px;

    font-size:15px;
  }

  main{
    padding:42px 18px 70px;
  }

  .title{
    margin-bottom:28px;
  }

  .title h1{
    font-size:30px;
  }

  .form-card{
    padding:20px;
  }

  .form-grid{
    grid-template-columns:minmax(0,1fr);
  }

  .message-card{
    padding:19px;
  }

  .meta{
    gap:8px;
  }

}


/* =========================
   小尺寸手機
========================= */

@media(max-width:480px){

  .brand-logo{
    height:42px;
  }

  .brand-name{
    font-size:16px;
  }

  .back{
    min-height:39px;

    padding:0 12px;

    font-size:14px;
  }

  main{
    padding-left:14px;
    padding-right:14px;
  }

  .message-card{
    padding:17px;
  }

  .reply{
    padding:14px;
  }

}

html{scroll-padding-top:96px}
body{overflow-x:hidden}
header.site-header{
  min-height:88px;
  padding:12px clamp(24px,6vw,100px);

  justify-content:space-between;

  align-items:center;
  gap:14px;

  font-weight:800;

.site-header .logo img{

@media(max-width:900px){

@media(max-width:520px){

/* 留言頁覆寫：使用全站導覽列，並防止超長內容破版 */
header.site-header{height:auto}
main{width:100%;max-width:1120px;margin:0 auto;padding:60px 24px 90px;min-width:0}
.message-card,.form-card,.list,.field{min-width:0;max-width:100%}
.message-card{overflow:hidden}
.text,.reply-text,.name{
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.text,.reply-text{white-space:pre-wrap}
.reply{white-space:normal}
.reply strong{display:block;margin-bottom:6px}

  main{padding:42px 18px 70px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
}



/* =========================================================
   富致康全站藍色視覺統一版｜留言板
   僅調整視覺，不更動 Supabase 留言功能
========================================================= */
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 88% 12%,rgba(7,151,211,.18) 0,rgba(7,151,211,.07) 20%,transparent 40%),
    radial-gradient(circle at 7% 62%,rgba(0,119,170,.10) 0,transparent 30%),
    linear-gradient(180deg,#dceff7 0%,#eaf6fa 42%,#f0f8fb 72%,#e3f2f7 100%);
}

main{
  position:relative;
  z-index:1;
}
main::before{
  content:"";
  position:absolute;
  width:430px;
  height:430px;
  right:-300px;
  top:80px;
  border-radius:50%;
  background:rgba(7,151,211,.06);
  pointer-events:none;
  z-index:-1;
}
main::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  left:-230px;
  bottom:80px;
  border-radius:50%;
  background:rgba(7,151,211,.055);
  pointer-events:none;
  z-index:-1;
}

.title span{color:#0797d3}
.title h1{
  color:#124d67;
  font-weight:800;
}
.title h1::after{
  content:"";
  display:block;
  width:46px;
  height:4px;
  margin:12px auto 0;
  border-radius:10px;
  background:#0797d3;
}

.form-card,
.message-card{
  background:rgba(255,255,255,.96);
  border:1px solid rgba(7,151,211,.16);
  box-shadow:0 9px 28px rgba(21,91,120,.08);
}
.form-card{
  border-radius:16px;
}
.message-card{
  border-radius:16px;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.message-card:hover{
  transform:translateY(-2px);
  border-color:rgba(7,151,211,.30);
  box-shadow:0 14px 32px rgba(21,91,120,.12);
}

.field label{color:#174f68}
.field input,
.field textarea{
  background:#fbfdfe;
  border-color:#c9e0e9;
}
.field input:focus,
.field textarea:focus{
  background:#fff;
  border-color:#0797d3;
  box-shadow:0 0 0 3px rgba(7,151,211,.10);
}

.submit{
  background:linear-gradient(135deg,#0797d3,#087eae);
  box-shadow:0 6px 16px rgba(7,151,211,.18);
}
.submit:hover{
  background:linear-gradient(135deg,#078bc2,#076f9b);
}

.reply{

<body>


<!-- =========================
     Header
========================= -->

<header class="site-header">
  <a href="index.html" class="logo">
    <img src="images/fzk.png" alt="富致康醫療器材 Logo">
    <span>富致康醫療器材</span>
  </a>
  <nav aria-label="主要導覽"><a href="index.html">首頁</a><a href="products.html">產品專區</a><a href="news.html">最新消息</a><a href="guestbook.html" class="active">留言板</a><a href="index.html#contact">聯絡我們</a></nav>
</header>


<!-- =========================
     主內容
========================= -->

<main>


  <!-- 標題 -->

  <div class="title">

    <span>
      MESSAGE BOARD
    </span>

    <h1>
      留言板
    </h1>

  </div>


  <!-- 留言表單 -->

  <section class="form-card">

    <form id="form">

      <div class="form-grid">


        <div class="field">

          <label>
            姓名／稱呼
          </label>

          <input
            id="name"
            maxlength="40"
            required
            placeholder="請輸入姓名或稱呼"
          >

        </div>


        <div class="field">

          <label>
            留言內容
          </label>

          <textarea
            id="message"
            maxlength="500"
            required
            placeholder="請輸入您的問題或留言"
          ></textarea>

        </div>


      </div>


      <button
        class="submit"
        type="submit"
      >
        送出留言
      </button>


      <div
        class="status"
        id="status"
      ></div>


    </form>

  </section>


  <!-- 留言列表 -->

  <section
    class="list"
    id="list"
  >

    <div class="empty">
      留言載入中…
    </div>

  </section>


</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const db=supabase.createClient(
  "https://sdkgiedglmhmchiietru.supabase.co",
  "sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm"
);


/* =========================
   防止 HTML 注入
========================= */

const esc=v=>
  String(v??"")
  .replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );


/* =========================
   日期格式
========================= */

const fmt=v=>
  new Date(v)
  .toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  );


/* =========================
   載入留言
========================= */

async function load(){

  const host=
    document.getElementById("list");


  const {data,error}=
    await db
    .from("guestbook_messages")
    .select(
      "id,name,message,reply,created_at"
    )
    .eq(
      "is_public",
      true
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    host.innerHTML=`
      <div class="empty">
        留言目前無法載入
      </div>
    `;

    return;

  }


  if(!data?.length){

    host.innerHTML=`
      <div class="empty">
        目前尚無公開留言
      </div>
    `;

    return;

  }


  host.innerHTML=data.map(x=>`<article class="message-card"><div class="meta"><span class="name">${esc(x.name)}</span><span>${fmt(x.created_at)}</span></div><div class="text">${esc(x.message)}</div>${x.reply?`<div class="reply"><strong>富致康回覆</strong><span class="reply-text">${esc(x.reply)}</span></div>`:""}</article>`).join("");

}


/* =========================
   送出留言
========================= */

document
.getElementById("form")
.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();


    const name=
      document
      .getElementById("name")
      .value
      .trim();


    const message=
      document
      .getElementById("message")
      .value
      .trim();


    const status=
      document
      .getElementById("status");


    status.textContent=
      "留言送出中…";


    const {error}=
      await db
      .from("guestbook_messages")
      .insert({
        name,
        message,
        is_public:false
      });


    if(error){

      status.textContent=
        "留言目前無法送出，請稍後再試。";

      return;

    }


    e.target.reset();


    status.textContent=
      "留言已送出，經確認後會顯示於留言板。";

  }
);


/* =========================
   啟動
========================= */

load();

</script>



<script id="auto-hide-header-script">
document.addEventListener("DOMContentLoaded",function(){
  const header =
    document.querySelector("header.site-header") ||
    document.querySelector("body > header");

  if(!header) return;

  const mq = window.matchMedia("(min-width: 901px)");
  let zone = document.getElementById("header-hover-zone");
  if(!zone){
    zone = document.createElement("div");
    zone.id = "header-hover-zone";
    zone.setAttribute("aria-hidden","true");
    document.body.appendChild(zone);
  }

  let hideTimer = null;

  function showHeader(){
    if(!mq.matches) return;
    clearTimeout(hideTimer);
    header.classList.add("header-visible");
  }

  function hideHeader(delay=180){
    if(!mq.matches) return;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{
      if(!header.matches(":hover") && !zone.matches(":hover")){
        header.classList.remove("header-visible");
      }
    },delay);
  }

  zone.addEventListener("mouseenter",showHeader);
  header.addEventListener("mouseenter",showHeader);
  header.addEventListener("mouseleave",()=>hideHeader(220));
  zone.addEventListener("mouseleave",()=>hideHeader(220));

  /* 滑鼠直接碰到螢幕最上緣也能叫出導覽列 */
  document.addEventListener("mousemove",function(e){
    if(!mq.matches) return;
    if(e.clientY <= 28) showHeader();
  });

  /* 按 ESC 可立即收起 */
  document.addEventListener("keydown",function(e){
    if(e.key === "Escape") header.classList.remove("header-visible");
  });

  function syncMode(){
    clearTimeout(hideTimer);
    if(mq.matches){
      header.classList.remove("header-visible");
    }else{
      header.classList.add("header-visible");
    }
  }

  if(mq.addEventListener) mq.addEventListener("change",syncMode);
  else mq.addListener(syncMode);

  syncMode();
});
</script>
