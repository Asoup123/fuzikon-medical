<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最新消息｜富致康醫療器材</title>
<meta name="description" content="富致康醫療器材最新消息、營業公告與服務資訊。">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{
  font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  color:#333;
  line-height:1.7;
  overflow-x:hidden;
  min-height:100vh;
  background:
    radial-gradient(circle at 88% 12%,rgba(7,151,211,.18) 0,rgba(7,151,211,.07) 20%,transparent 40%),
    radial-gradient(circle at 7% 62%,rgba(0,119,170,.10) 0,transparent 30%),
    linear-gradient(180deg,#dceff7 0%,#eaf6fa 42%,#f0f8fb 72%,#e3f2f7 100%);
}
a{text-decoration:none}

/* ===== 全站共用固定導覽列 ===== */
header.site-header{
  min-height:88px;
  padding:12px clamp(24px,6vw,100px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
  position:sticky;
  top:0;
  z-index:5000;
  background:rgba(255,255,255,.97);
  box-shadow:0 3px 18px rgba(0,0,0,.06);
  backdrop-filter:blur(10px);
}
.site-header .logo{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  flex:0 1 auto;
  color:#0797d3;
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}
.site-header .logo img{
  height:54px;
  width:auto;
  display:block;
  flex:0 0 auto;
}
.site-header nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:clamp(14px,2vw,42px);
  min-width:0;
  white-space:nowrap;
}
.site-header nav a{
  position:relative;
  padding:10px 2px;
  color:#333;
  font-size:15px;
  font-weight:600;
  transition:.2s ease;
}
.site-header nav a:hover,
.site-header nav a.active{color:#0797d3}
.site-header nav a.active::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:3px;
  height:3px;
  border-radius:3px;
  background:#0797d3;
}

/* ===== 最新消息 ===== */
.news-main{
  position:relative;
  max-width:1120px;
  margin:auto;
  padding:64px 24px 100px;
}
.news-main::before{
  content:"";
  position:absolute;
  width:430px;
  height:430px;
  right:-260px;
  top:80px;
  border-radius:50%;
  background:rgba(7,151,211,.065);
  pointer-events:none;
}
.news-main::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  left:-210px;
  bottom:100px;
  border-radius:50%;
  background:rgba(7,151,211,.055);
  pointer-events:none;
}
.page-title{
  position:relative;
  z-index:1;
  text-align:center;
  margin-bottom:42px;
}
.page-title span{
  display:block;
  color:#0797d3;
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:6px;
}
.page-title h1{
  color:#124d67;
  font-size:38px;
  font-weight:800;
}
.page-title h1::after{
  content:"";
  display:block;
  width:46px;
  height:4px;
  margin:12px auto 0;
  border-radius:10px;
  background:#0797d3;
}
.page-title p{margin-top:12px;color:#637d88}

.news-list{
  position:relative;
  z-index:1;
  display:grid;
  gap:22px;
}
.news-card{
  min-width:0;
  overflow:hidden;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(7,151,211,.16);
  border-radius:16px;
  padding:26px;
  box-shadow:0 9px 28px rgba(21,91,120,.08);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.news-card:hover{
  transform:translateY(-3px);
  border-color:rgba(7,151,211,.32);
  box-shadow:0 16px 34px rgba(21,91,120,.13);
}
.news-card.has-image{
  display:grid;
  grid-template-columns:minmax(240px,34%) minmax(0,1fr);
  gap:26px;
  align-items:stretch;
}
.news-image{
  min-width:0;
  overflow:hidden;
  border-radius:12px;
  background:#eef7fa;
}
.news-image img{
  display:block;
  width:100%;
  height:100%;
  min-height:210px;
  max-height:300px;
  object-fit:cover;
}
.news-body{min-width:0}
.news-date{
  color:#0797d3;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}
.news-card h2{
  color:#17465c;
  font-size:24px;
  margin-bottom:10px;
  overflow-wrap:anywhere;
}
.news-content{
  color:#536b76;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.empty{
  padding:48px 20px;
  text-align:center;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(7,151,211,.16);
  border-radius:16px;
  box-shadow:0 9px 28px rgba(21,91,120,.07);
  color:#78909c;
}

@media(max-width:900px){
  header.site-header{
    min-height:auto;
    padding:10px 18px;
    gap:14px;
    flex-wrap:wrap;
  }
  .site-header .logo{font-size:18px}
  .site-header .logo img{height:46px}
  .site-header nav{
    order:2;width:100%;margin-left:0;gap:20px;
    overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  }
  .site-header nav::-webkit-scrollbar{display:none}
  .site-header nav a{font-size:14px;flex:0 0 auto}
}
@media(max-width:700px){
  body{
    background:linear-gradient(180deg,#dceff7 0%,#edf7fa 52%,#e3f2f7 100%);
  }
  .news-main{padding:44px 16px 70px}
  .page-title h1{font-size:31px}
  .news-card{padding:19px}
  .news-card.has-image{grid-template-columns:1fr}
  .news-image img{height:220px;min-height:0;max-height:none}
  .news-main::before{width:260px;height:260px;right:-160px}
  .news-main::after{width:220px;height:220px;left:-150px}
}
@media(max-width:520px){
  header.site-header{padding:9px 14px}
  .site-header .logo{font-size:16px;gap:9px}
  .site-header .logo img{height:42px}
}
</style>

<style id="auto-hide-header-style">
/* ===== 全站桌機版導覽列：滑到最上方才顯示 ===== */
@media (min-width: 901px){
  html{scroll-padding-top:18px !important;}

  header.site-header,
  body > header:first-of-type{
    position:fixed !important;
    top:0 !important;
    left:0 !important;
    right:0 !important;
    width:100% !important;
    z-index:5000 !important;
    transform:translateY(calc(-100% - 8px));
    transition:transform .28s cubic-bezier(.22,1,.36,1),
               box-shadow .28s ease !important;
    will-change:transform;
  }

  header.site-header.header-visible,
  body > header:first-of-type.header-visible{
    transform:translateY(0) !important;
    box-shadow:0 8px 28px rgba(0,0,0,.10) !important;
  }

  #header-hover-zone{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:12px;
    z-index:4999;
    background:transparent;
  }
}

/* 手機／平板維持正常顯示，不使用 hover 收合 */
@media (max-width: 900px){
  #header-hover-zone{display:none !important;}
  header.site-header,
  body > header:first-of-type{
    transform:none !important;
  }
}
</style>

</head>
<body>
<header class="site-header">
  <a href="index.html" class="logo">
    <img src="images/fzk.png" alt="富致康醫療器材 Logo">
    <span>富致康醫療器材</span>
  </a>
  <nav aria-label="主要導覽">
    <a href="index.html">首頁</a>
    <a href="products.html">產品專區</a>
    <a href="news.html" class="active">最新消息</a>
    <a href="guestbook.html">留言板</a>
    <a href="index.html#contact">聯絡我們</a>
  </nav>
</header>

<main class="news-main">
  <div class="page-title">
    <span>NEWS</span>
    <h1>最新消息</h1>
    <p>營業公告、服務資訊與富致康最新動態</p>
  </div>
  <section class="news-list" id="newsList">
    <div class="empty">最新消息載入中…</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient(
  "https://sdkgiedglmhmchiietru.supabase.co",
  "sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm"
);

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
}[m]));

const fmt=v=>{
  if(!v)return "";
  const d=new Date(v+"T00:00:00");
  return Number.isNaN(d.getTime())
    ?esc(v)
    :d.toLocaleDateString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit"});
};

async function loadNews(){
  const host=document.getElementById("newsList");

  const {data,error}=await db.from("news")
    .select("id,title,content,publish_date,image_url")
    .eq("is_public",true)
    .order("publish_date",{ascending:false})
    .order("created_at",{ascending:false});

  if(error){
    host.innerHTML='<div class="empty">最新消息目前無法載入</div>';
    return;
  }

  if(!data?.length){
    host.innerHTML='<div class="empty">目前尚無最新消息</div>';
    return;
  }

  host.innerHTML=data.map(n=>`
    <article class="news-card ${n.image_url?"has-image":""}">
      ${n.image_url
        ?`<div class="news-image"><img src="${esc(n.image_url)}" alt="${esc(n.title)}" loading="lazy"></div>`
        :""
      }
      <div class="news-body">
        <div class="news-date">${fmt(n.publish_date)}</div>
        <h2>${esc(n.title)}</h2>
        <div class="news-content">${esc(n.content)}</div>
      </div>
    </article>
  `).join("");
}

loadNews();
</script>

<script id="auto-hide-header-script">
document.addEventListener("DOMContentLoaded",function(){
  const header =
    document.querySelector("header.site-header") ||
    document.querySelector("body > header");

  if(!header) return;

  const mq = window.matchMedia("(min-width: 901px)");
  let zone = document.getElementById("header-hover-zone");
  if(!zone){
    zone = document.createElement("div");
    zone.id = "header-hover-zone";
    zone.setAttribute("aria-hidden","true");
    document.body.appendChild(zone);
  }

  let hideTimer = null;

  function showHeader(){
    if(!mq.matches) return;
    clearTimeout(hideTimer);
    header.classList.add("header-visible");
  }

  function hideHeader(delay=180){
    if(!mq.matches) return;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{
      if(!header.matches(":hover") && !zone.matches(":hover")){
        header.classList.remove("header-visible");
      }
    },delay);
  }

  zone.addEventListener("mouseenter",showHeader);
  header.addEventListener("mouseenter",showHeader);
  header.addEventListener("mouseleave",()=>hideHeader(220));
  zone.addEventListener("mouseleave",()=>hideHeader(220));

  /* 滑鼠直接碰到螢幕最上緣也能叫出導覽列 */
  document.addEventListener("mousemove",function(e){
    if(!mq.matches) return;
    if(e.clientY <= 10) showHeader();
  });

  /* 按 ESC 可立即收起 */
  document.addEventListener("keydown",function(e){
    if(e.key === "Escape") header.classList.remove("header-visible");
  });

  function syncMode(){
    clearTimeout(hideTimer);
    if(mq.matches){
      header.classList.remove("header-visible");
    }else{
      header.classList.add("header-visible");
    }
  }

  if(mq.addEventListener) mq.addEventListener("change",syncMode);
  else mq.addListener(syncMode);

  syncMode();
});
</script>

</body>
</html>
