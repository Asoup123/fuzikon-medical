<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最新消息｜富致康醫療器材</title>
<meta name="description" content="富致康醫療器材最新消息、營業公告與服務資訊。">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{
  font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  color:#333;
  line-height:1.7;
  overflow-x:clip;
  min-height:100vh;
  background:
    radial-gradient(circle at 88% 12%,rgba(7,151,211,.18) 0,rgba(7,151,211,.07) 20%,transparent 40%),
    radial-gradient(circle at 7% 62%,rgba(0,119,170,.10) 0,transparent 30%),
    linear-gradient(180deg,#dceff7 0%,#eaf6fa 42%,#f0f8fb 72%,#e3f2f7 100%);
}
a{text-decoration:none}

/* ===== 全站共用固定導覽列 ===== */
header.site-header{
  min-height:88px;
  padding:12px clamp(24px,6vw,100px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
  position:sticky;
  top:0;
  z-index:5000;
  background:rgba(255,255,255,.97);
  box-shadow:0 3px 18px rgba(0,0,0,.06);
  backdrop-filter:blur(10px);
}
.site-header .logo{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  flex:0 1 auto;
  color:#0797d3;
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}
.site-header .logo img{
  height:54px;
  width:auto;
  display:block;
  flex:0 0 auto;
}
.site-header nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:clamp(14px,2vw,42px);
  min-width:0;
  white-space:nowrap;
}
.site-header nav a{
  position:relative;
  padding:10px 2px;
  color:#333;
  font-size:15px;
  font-weight:600;
  transition:.2s ease;
}
.site-header nav a:hover,
.site-header nav a.active{color:#0797d3}
.site-header nav a.active::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:3px;
  height:3px;
  border-radius:3px;
  background:#0797d3;
}

/* ===== 最新消息 ===== */
.news-main{
  position:relative;
  max-width:1120px;
  margin:auto;
  padding:64px 24px 100px;
}
.news-main::before{
  content:"";
  position:absolute;
  width:430px;
  height:430px;
  right:-260px;
  top:80px;
  border-radius:50%;
  background:rgba(7,151,211,.065);
  pointer-events:none;
}
.news-main::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  left:-210px;
  bottom:100px;
  border-radius:50%;
  background:rgba(7,151,211,.055);
  pointer-events:none;
}
.page-title{
  position:relative;
  z-index:1;
  text-align:center;
  margin-bottom:42px;
}
.page-title span{
  display:block;
  color:#0797d3;
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:6px;
}
.page-title h1{
  color:#124d67;
  font-size:38px;
  font-weight:800;
}
.page-title h1::after{
  content:"";
  display:block;
  width:46px;
  height:4px;
  margin:12px auto 0;
  border-radius:10px;
  background:#0797d3;
}
.page-title p{margin-top:12px;color:#637d88}

.news-list{
  position:relative;
  z-index:1;
  display:grid;
  gap:22px;
}
.news-card{
  min-width:0;
  overflow:hidden;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(7,151,211,.16);
  border-radius:16px;
  padding:26px;
  box-shadow:0 9px 28px rgba(21,91,120,.08);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.news-card:hover{
  transform:translateY(-3px);
  border-color:rgba(7,151,211,.32);
  box-shadow:0 16px 34px rgba(21,91,120,.13);
}
.news-card.has-image{
  display:grid;
  grid-template-columns:minmax(240px,34%) minmax(0,1fr);
  gap:26px;
  align-items:stretch;
}
.news-image{
  min-width:0;
  overflow:hidden;
  border-radius:12px;
  background:#eef7fa;
}
.news-image img{
  display:block;
  width:100%;
  height:100%;
  min-height:210px;
  max-height:300px;
  object-fit:cover;
}
.news-body{min-width:0}
.news-date{
  color:#0797d3;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}
.news-card h2{
  color:#17465c;
  font-size:24px;
  margin-bottom:10px;
  overflow-wrap:anywhere;
}
.news-content{
  color:#536b76;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.empty{
  padding:48px 20px;
  text-align:center;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(7,151,211,.16);
  border-radius:16px;
  box-shadow:0 9px 28px rgba(21,91,120,.07);
  color:#78909c;
}

@media(max-width:900px){
  header.site-header{
    min-height:auto;
    padding:10px 18px;
    gap:14px;
    flex-wrap:wrap;
  }
  .site-header .logo{font-size:18px}
  .site-header .logo img{height:46px}
  .site-header nav{
    order:2;width:100%;margin-left:0;gap:20px;
    overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  }
  .site-header nav::-webkit-scrollbar{display:none}
  .site-header nav a{font-size:14px;flex:0 0 auto}
}
@media(max-width:700px){
  body{
    background:linear-gradient(180deg,#dceff7 0%,#edf7fa 52%,#e3f2f7 100%);
  }
  .news-main{padding:44px 16px 70px}
  .page-title h1{font-size:31px}
  .news-card{padding:19px}
  .news-card.has-image{grid-template-columns:1fr}
  .news-image img{height:220px;min-height:0;max-height:none}
  .news-main::before{width:260px;height:260px;right:-160px}
  .news-main::after{width:220px;height:220px;left:-150px}
}
@media(max-width:520px){
  header.site-header{padding:9px 14px}
  .site-header .logo{font-size:16px;gap:9px}
  .site-header .logo img{height:42px}
}

/* 點開消息閱讀完整圖片及內文 */
.news-card{cursor:pointer}
.news-card:focus-visible{outline:3px solid #0797d3;outline-offset:4px}
.news-open,.news-close{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 18px;background:#0797d3;color:#fff;font-weight:700}
.news-open{margin-top:18px}
.news-open:focus-visible,.news-close:focus-visible{outline:3px solid #17465c;outline-offset:3px}
.news-dialog{margin:auto;width:min(1100px,94vw);max-height:90vh;max-height:90dvh;padding:0;border:1px solid #c9e0e9;border-radius:16px;background:#fff;color:#536b76;overflow:auto;overscroll-behavior:contain}
.news-dialog::backdrop{background:rgba(9,36,50,.72)}
.news-dialog-bar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px 18px;background:#fff;border-bottom:1px solid #edf2f4;z-index:1}
.news-detail{padding:24px clamp(18px,4vw,44px) 36px}
.news-detail h2{color:#17465c;font-size:clamp(22px,4vw,30px);overflow-wrap:anywhere;margin-bottom:18px}
.news-detail-image{display:block;width:100%;height:auto;max-height:none;object-fit:contain;margin:0 auto 12px}
.news-detail-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}
html.news-reading{overflow:hidden}

</style>

#home-social{position:fixed;right:24px;bottom:96px;display:flex;flex-direction:column;gap:14px;z-index:4900}

}

<main class="news-main">

</main>

<dialog id="newsDialog" class="news-dialog" aria-labelledby="newsDetailTitle">
  <div class="news-dialog-bar"><button type="button" class="news-close" id="newsClose" autofocus>關閉 ×</button></div>
  <article class="news-detail">

    <h2 id="newsDetailTitle"></h2>
    <img id="newsDetailImage" class="news-detail-image" alt="" hidden>
    <div id="newsDetailAttachments" style="display:grid;gap:10px;margin:18px 0;overflow-wrap:anywhere"></div>
    <div id="newsDetailContent" class="news-detail-content"></div>
  </article>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient(
  "https://sdkgiedglmhmchiietru.supabase.co",
  "sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm"
);

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
}[m]));

const fmt=v=>{
  if(!v)return "";
  const d=new Date(v+"T00:00:00");
  return Number.isNaN(d.getTime())
    ?esc(v)
    :d.toLocaleDateString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit"});
};

let newsItems=[];

async function loadNews(){
  const host=document.getElementById("newsList");

  const {data,error}=await db.from("news")
    .select("id,title,content,publish_date,image_url,attachments")
    .eq("is_public",true)
    .order("publish_date",{ascending:false})
    .order("created_at",{ascending:false});

  if(error){
    host.innerHTML='<div class="empty">最新消息目前無法載入</div>';
    return;
  }

  if(!data?.length){
    host.innerHTML='<div class="empty">目前尚無最新消息</div>';
    return;
  }

  newsItems=data;
  host.innerHTML=data.map((n,index)=>`
    <article class="news-card ${n.image_url?"has-image":""}" data-news-index="${index}" role="button" tabindex="0" aria-haspopup="dialog" aria-controls="newsDialog" aria-label="${esc('閱讀全文：'+n.title)}">
      ${n.image_url
        ?`<div class="news-image"><img src="${esc(n.image_url)}" alt="${esc(n.title)}" loading="lazy"></div>`
        :""
      }
      <div class="news-body">
        <div class="news-date">${fmt(n.publish_date)}</div>
        <h2>${esc(n.title)}</h2>
        <div class="news-content">${esc(n.content)}</div>
      </div>
    </article>
  `).join("");
}


document.getElementById('newsList').addEventListener('keydown',event=>{
  if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-news-index]')){
    event.preventDefault();event.target.click();
  }
});
const newsDialog=document.getElementById('newsDialog');
let newsTrigger=null;
document.getElementById('newsList').addEventListener('click',event=>{
  const card=event.target.closest('[data-news-index]');
  if(!card)return;
  const item=newsItems[Number(card.dataset.newsIndex)];
  if(!item)return;
  newsTrigger=card;
  document.getElementById('newsDetailTitle').textContent=item.title||'';
  document.getElementById('newsDetailDate').textContent=fmt(item.publish_date);
  document.getElementById('newsDetailContent').textContent=item.content||'';
  const img=document.getElementById('newsDetailImage');
  let imageUrl='';
  try{const url=new URL(item.image_url,location.href);if(item.image_url&&['https:','http:'].includes(url.protocol))imageUrl=url.href;}catch{}
  img.hidden=!imageUrl;
  if(imageUrl){img.src=imageUrl;img.alt=item.title||'消息圖片';}
  else{img.removeAttribute('src');}
  const attachmentHost=document.getElementById('newsDetailAttachments');attachmentHost.replaceChildren();
  if(Array.isArray(item.attachments))item.attachments.forEach(file=>{
    if(!file.path)return;
    const button=document.createElement('button');button.type='button';button.className='news-open';
    button.textContent='下載附件：'+(file.name||'附件');
    button.onclick=async()=>{
      button.disabled=true;button.textContent='正在取得下載連結…';
      try{
        const {data,error}=await db.storage.from('news-attachments').createSignedUrl(file.path,60,{download:file.name||true});
        if(error)throw error;
        const link=document.createElement('a');link.href=data.signedUrl;link.download=file.name||'';link.target='_blank';link.rel='noopener';link.click();
      }catch(e){alert('附件目前無法下載，請稍後再試。');}
      finally{button.disabled=false;button.textContent='下載附件：'+(file.name||'附件');}
    };
    attachmentHost.append(button);
  });
  newsDialog.showModal();
  newsDialog.scrollTop=0;
  document.documentElement.classList.add('news-reading');
});
document.getElementById('newsClose').addEventListener('click',()=>newsDialog.close());
newsDialog.addEventListener('click',event=>{
  if(event.target!==newsDialog)return;
  const rect=newsDialog.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)newsDialog.close();
});
newsDialog.addEventListener('close',()=>{
  document.documentElement.classList.remove('news-reading');
  newsTrigger?.focus({preventScroll:true});
});

loadNews();
</script>
