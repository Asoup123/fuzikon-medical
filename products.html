<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:description" content="富致康醫療器材產品專區，提供輪椅、行動輔具、照護輔具、醫療用品及各式輔具維修服務。">
    <meta property="og:url" content="https://fuzikon.com.tw/products.html">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                "Microsoft JhengHei",
                "Noto Sans TC",
                Arial,
                sans-serif;

            background: #f6f9fb;
            color: #333;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            min-height: 82px;
            padding: 12px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255,255,255,0.97);

            box-shadow:
                0 3px 18px rgba(0,0,0,0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;

            color: #0797d3;

            font-size: 22px;
            font-weight: 800;
        }

        .logo img {
            height: 54px;
            width: auto;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #333;

            font-size: 15px;
            font-weight: 600;

            transition: 0.25s;
        }

        nav a:hover {
            color: #0797d3;
        }

        .home-button {
            padding: 9px 18px;

            color: white !important;
            background: #0797d3;

            border-radius: 7px;
        }


        /* =========================
           HERO
        ========================= */

        .page-hero {
            padding: 82px 8% 76px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #075b82,
                    #079bd8
                );
        }

        .page-hero span {
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.8;
        }

        .page-hero h1 {
            margin: 8px 0 10px;
            font-size: 44px;
        }

        .page-hero p {
            max-width: 700px;
            margin: auto;

            color: rgba(255,255,255,0.87);
        }


        /* =========================
           CATEGORY
        ========================= */

        .category-section {
            padding: 55px 8% 25px;
        }

        .category-buttons {
            max-width: 1100px;
            margin: auto;

            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-button {
            padding: 10px 20px;

            color: #555;
            background: white;

            border: 1px solid #d7e2e7;
            border-radius: 30px;

            cursor: pointer;

            font-family: inherit;
            font-size: 15px;

            transition: 0.25s;
        }

        .category-button:hover,
        .category-button.active {
            color: white;
            background: #0797d3;
            border-color: #0797d3;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products-section {
            padding: 30px 8% 100px;
        }

        .products-container {
            max-width: 1250px;
            margin: auto;
        }

        .products-heading {
            margin-bottom: 30px;
        }

        .products-heading h2 {
            margin-bottom: 4px;

            color: #164c65;

            font-size: 32px;
        }

        .products-heading p {
            color: #777;
        }

        .product-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }

        .product-card {
            overflow: hidden;

            display: flex;
            flex-direction: column;

            background: white;

            border: 1px solid #e1e9ed;
            border-radius: 17px;

            box-shadow:
                0 4px 16px rgba(0,0,0,0.035);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 16px 36px rgba(0,0,0,0.09);
        }

        .product-image {
            height: 380px;
            padding: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background: #ffffff;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .second-image {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            padding: 25px;

            object-fit: contain;

            opacity: 0;

            background: #ffffff;

            transition: 0.35s;
        }

        .product-card:hover .second-image {
            opacity: 1;
        }

        .product-content {
            padding: 24px;

            display: flex;
            flex-direction: column;

            flex: 1;
        }

        .product-type {
            align-self: flex-start;

            display: inline-block;

            padding: 5px 12px;
            margin-bottom: 8px;

            color: #0797d3;
            background: #e8f7fc;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 800;
        }

        .product-content h3 {
            margin-bottom: 9px;

            color: #222;

            font-size: 24px;
        }

        .product-intro {
            min-height: 72px;

            color: #707070;

            font-size: 14px;
        }

        .product-features {
            margin: 17px 0;
            padding-top: 13px;

            list-style: none;

            border-top: 1px solid #eee;
        }

        .product-features li {
            position: relative;

            margin: 7px 0;
            padding-left: 22px;

            color: #555;

            font-size: 14px;
        }

        .product-features li::before {
            content: "✓";

            position: absolute;
            left: 0;

            color: #0797d3;

            font-weight: bold;
        }

        .subsidy {
            margin-top: auto;
            margin-bottom: 18px;

            padding: 11px 13px;

            color: #176182;
            background: #f0f8fb;

            border-radius: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        .ask-button {
            display: block;

            width: 100%;

            padding: 11px;

            color: white;
            background: #0797d3;

            border-radius: 7px;

            text-align: center;

            font-weight: 700;

            transition: 0.25s;
        }

        .ask-button:hover {
            background: #087ead;
        }


        /* =========================
           尚未新增產品的分類
        ========================= */

        .coming-card {
            min-height: 300px;

            padding: 45px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            background: white;

            border: 1px solid #e1e9ed;
            border-radius: 17px;

            box-shadow:
                0 4px 16px rgba(0,0,0,0.035);
        }

        .coming-card h3 {
            margin-bottom: 10px;

            color: #164c65;

            font-size: 22px;
        }

        .coming-card p {
            max-width: 280px;

            color: #888;

            font-size: 14px;
        }


        /* =========================
           HELP
        ========================= */

        .help-section {
            padding: 65px 8%;

            color: white;
            background: #143f53;

            text-align: center;
        }

        .help-section h2 {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .help-section p {
            margin-bottom: 22px;

            color: rgba(255,255,255,0.8);
        }

        .help-buttons {
            display: flex;
            justify-content: center;

            gap: 12px;
            flex-wrap: wrap;
        }

        .help-buttons a {
            padding: 11px 21px;

            color: #087ead;
            background: white;

            border-radius: 6px;

            font-weight: 700;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 28px;

            color: rgba(255,255,255,0.78);
            background: #0e3040;

            text-align: center;

            font-size: 14px;
        }

        .product-item {
            display: flex;
        }

        .product-item.hidden {
            display: none;
        }


        /* =========================
           RWD
        ========================= */

        @media (max-width: 1000px) {

            .product-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 750px) {

            header {
                flex-direction: column;
                gap: 12px;
            }

            nav {
                justify-content: center;
                flex-wrap: wrap;
                gap: 14px;
            }

            .page-hero h1 {
                font-size: 36px;
            }

        }

        @media (max-width: 600px) {

            .logo {
                font-size: 19px;
            }

            .logo img {
                height: 44px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 350px;
            }

            .page-hero {
                padding: 60px 6%;
            }

            .category-section,
            .products-section {
                padding-left: 6%;
                padding-right: 6%;
            }

        }

    
        /* =========================
           SUPABASE 動態商品
        ========================= */

        .loading-box,
        .empty-box {
            grid-column: 1 / -1;
            padding: 70px 20px;
            background: white;
            border: 1px solid #e1e9ed;
            border-radius: 17px;
            color: #78878e;
            text-align: center;
        }

        .featured-badge {
            position: absolute;
            left: 18px;
            top: 18px;
            padding: 5px 11px;
            color: white;
            background: #f39c12;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            z-index: 2;
        }

        .product-card .subsidy {
            margin-top: auto;
        }

        .detail-button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            color: white;
            background: #0797d3;
            border: 0;
            border-radius: 7px;
            text-align: center;
            font-weight: 700;
            transition: 0.25s;
        }

        .detail-button:hover {
            background: #087ead;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0,0,0,0.56);
        }

        .modal.show {
            display: flex;
        }

        .modal-dialog {
            width: min(1120px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
            background: white;
            border-radius: 20px;
        }

        .modal-close {
            position: sticky;
            float: right;
            top: 14px;
            right: 14px;
            z-index: 10;
            width: 42px;
            height: 42px;
            margin: 16px 16px 0 0;
            border: 0;
            border-radius: 50%;
            background: #f0f3f5;
            color: #444;
            font-size: 24px;
        }

        .modal-inner {
            padding: 42px;
        }

        .modal-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .main-photo {
            height: 450px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 14px;
        }

        .main-photo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .thumbnail-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .thumbnail {
            width: 72px;
            height: 72px;
            padding: 5px;
            border: 1px solid #dbe4e8;
            border-radius: 8px;
            background: white;
        }

        .thumbnail.active {
            border: 2px solid #0797d3;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-category {
            display: inline-block;
            padding: 5px 12px;
            color: #0797d3;
            background: #e8f7fc;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .modal-info h2 {
            margin: 12px 0 14px;
            color: #164c65;
            font-size: 34px;
        }

        .modal-description {
            color: #666;
            white-space: pre-line;
        }

        .modal-subsidy {
            margin-top: 20px;
            padding: 13px;
            color: #176182;
            background: #edf8fc;
            border-radius: 8px;
            font-weight: 700;
        }

        .detail-section {
            margin-top: 38px;
            padding-top: 30px;
            border-top: 1px solid #e5eaed;
        }

        .detail-section h3 {
            margin-bottom: 18px;
            color: #164c65;
            font-size: 24px;
        }

        .feature-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 22px;
        }

        .feature-list li {
            position: relative;
            padding-left: 22px;
            color: #555;
        }

        .feature-list li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #0797d3;
            font-weight: 900;
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
        }

        .spec-table tr:nth-child(odd) {
            background: #f6f9fa;
        }

        .spec-table th,
        .spec-table td {
            padding: 13px 16px;
            border-bottom: 1px solid #e8edef;
            text-align: left;
        }

        .spec-table th {
            width: 35%;
            color: #164c65;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .modal-top {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .modal-inner {
                padding: 26px 18px 32px;
            }

            .main-photo {
                height: 330px;
            }

            .feature-list {
                grid-template-columns: 1fr;
            }
        }

    
        /* =========================
           多型號規格比較表
        ========================= */

        .variant-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e3eaed;
            border-radius: 12px;
            background: white;
        }

        .variant-table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }

        .variant-table th,
        .variant-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #e8edef;
            border-right: 1px solid #edf1f3;
            text-align: center;
            white-space: nowrap;
        }

        .variant-table th:last-child,
        .variant-table td:last-child {
            border-right: 0;
        }

        .variant-table thead th {
            background: #eef7fb;
            color: #164c65;
            font-weight: 800;
        }

        .variant-table tbody tr:nth-child(even) {
            background: #fafcfd;
        }

        .variant-model {
            color: #164c65;
            font-weight: 800;
            text-align: left !important;
        }

        .variant-note {
            margin-top: 10px;
            color: #7a8a91;
            font-size: 13px;
        }

    
        .admin-login-link {
            margin-left: 10px;
            color: rgba(255,255,255,0.34);
            font-size: 11px;
            font-weight: 400;
            transition: 0.25s;
        }

        .admin-login-link:hover {
            color: rgba(255,255,255,0.72);
        }

    
        /* =========================================================
           2026-09-18 產品專區新版
           左側分類＋搜尋 / 四欄極簡商品卡 / 內頁圖片箭頭 / 聯絡資訊
        ========================================================= */

        body {
            background: #f7f9fa;
        }

        .products-section {
            padding: 42px 4.5% 85px;
        }

        .products-layout {
            width: 100%;
            max-width: 1560px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 34px;
            align-items: start;
        }

        .product-sidebar {
            position: sticky;
            top: 106px;
            background: #fff;
            border: 1px solid #e1e8ec;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,.035);
        }

        .sidebar-search input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #d7e2e7;
            border-radius: 9px;
            outline: none;
            color: #333;
            background: #fbfcfd;
            font: inherit;
            transition: .2s;
        }

        .sidebar-search input:focus {
            border-color: #0797d3;
            box-shadow: 0 0 0 3px rgba(7,151,211,.09);
            background: #fff;
        }

        .sidebar-title {
            margin: 19px 4px 9px;
            color: #164c65;
            font-size: 15px;
            font-weight: 800;
        }

        .category-buttons {
            max-width: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
        }

        .category-button {
            width: 100%;
            padding: 10px 13px;
            border: 0;
            border-radius: 8px;
            text-align: left;
            color: #4d5960;
            background: transparent;
            font-size: 14px;
        }

        .category-button:hover {
            color: #0797d3;
            background: #eef8fc;
        }

        .category-button.active {
            color: #fff;
            background: #0797d3;
        }

        .products-main {
            min-width: 0;
        }

        .products-heading {
            margin: 0 0 22px;
        }

        .products-heading h1 {
            margin: 0 0 2px;
            color: #164c65;
            font-size: 28px;
        }

        .products-heading p {
            color: #7a858b;
            font-size: 14px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .product-card {
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid #e1e7ea;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.025);
            cursor: pointer;
            transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: #cfdde3;
            box-shadow: 0 10px 25px rgba(0,0,0,.07);
        }

        .product-image {
            height: 245px;
            padding: 22px 22px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-content {
            min-height: 82px;
            padding: 10px 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .product-content h3 {
            margin: 0;
            color: #222;
            font-size: 17px;
            line-height: 1.55;
            font-weight: 700;
        }

        .product-type,
        .product-intro,
        .product-features,
        .product-card .subsidy,
        .product-card .ask-button,
        .product-card .detail-button,
        .featured-badge {
            display: none !important;
        }

        .loading-box,
        .empty-box {
            grid-column: 1 / -1;
        }

        /* 商品詳細視窗 */
        .modal-dialog {
            width: min(1160px, 100%);
        }

        .modal-top {
            grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
            gap: 42px;
        }

        .main-photo {
            position: relative;
            height: 470px;
            padding: 24px;
            overflow: hidden;
        }

        .photo-arrow {
            position: absolute;
            top: 50%;
            z-index: 4;
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #164c65;
            background: rgba(255,255,255,.94);
            box-shadow: 0 4px 16px rgba(0,0,0,.13);
            font-size: 28px;
            line-height: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        .photo-arrow.prev { left: 14px; }
        .photo-arrow.next { right: 14px; }

        .main-photo:hover .photo-arrow {
            opacity: 1;
            pointer-events: auto;
        }

        .photo-arrow:hover {
            transform: translateY(-50%) scale(1.06);
        }

        .thumbnail {
            cursor: pointer;
        }

        .modal-info .ask-button {
            display: none !important;
        }

        /* 商品特色整區不顯示；規格與型號保留 */
        .detail-section.product-feature-section {
            display: none !important;
        }

        /* 產品頁底部聯絡資訊 */
        .product-contact-section {
            padding: 0 4.5% 70px;
            background: #f7f9fa;
        }

        .product-contact-wrap {
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(330px, .82fr) minmax(480px, 1.18fr);
            gap: 28px;
            align-items: stretch;
        }

        .product-contact-card {
            padding: 38px 40px;
            color: #fff;
            background: linear-gradient(135deg,#08749e,#079bd8);
            border-radius: 18px;
        }

        .product-contact-card h2 {
            margin-bottom: 7px;
            font-size: 28px;
        }

        .contact-intro {
            margin-bottom: 27px;
            color: rgba(255,255,255,.88);
            font-size: 14px;
        }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://sdkgiedglmhmchiietru.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const productGrid =
    document.getElementById("productGrid");

const title =
    document.getElementById("category-title");


const modal =
    document.getElementById("productModal");

const modalContent =
    document.getElementById("modalContent");

let allProducts = [];
let activeCategory = "all";
let searchKeyword = "";
let modalImages = [];
let modalImageIndex = 0;


const categoryText = {

    all: [
        "全部產品",
        "富致康醫療器材產品一覽"
    ],

    "aluminum-wheelchair": [
        "鋁製輪椅",
        "輕量化鋁合金輪椅系列"
    ],

    "steel-wheelchair": [
        "鐵製輪椅",
        "耐用穩固鐵製輪椅系列"
    ],

    rollator: [
        "助步車",
        "行走輔助與移動支撐用品"
    ],

    "commode-chair": [
        "便椅",
        "如廁輔助相關用品"
    ],

    "shower-chair": [
        "洗澡椅",
        "沐浴使用安全輔助用品"
    ],

    walker: [
        "助行器",
        "提升行走穩定與安全"
    ],

    "cane-crutch": [
        "手／拐杖",
        "各式手杖與拐杖用品"
    ],

    "quad-cane": [
        "四腳拐",
        "四點支撐型行走輔具"
    ],

    accessories: [
        "輔助用品",
        "各式醫療與生活輔助用品"
    ]

};


function categoryName(category) {

    return categoryText[category]
        ? categoryText[category][0]
        : category;
}


async function loadProducts() {

    productGrid.innerHTML = `
        <div class="loading-box">
            商品載入中...
        </div>
    `;

    const {
        data,
        error
    } =
        await db
        .from("products")
        .select("*")
        .eq("is_active", true)
        .order(
            "sort_order",
            {
                ascending: true
            }
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        productGrid.innerHTML = `
            <div class="empty-box">
                商品讀取失敗：${escapeHTML(error.message)}
            </div>
        `;

        console.error(error);

        return;
    }

    allProducts =
        data || [];

    const params =
        new URLSearchParams(
            window.location.search
        );

    const requested =
        params.get("category");

    if (
        requested &&
        categoryText[requested]
    ) {
        filterProducts(requested);
    } else {
        filterProducts("all");
    }
}


function filterProducts(category) {

    activeCategory = category || "all";

    document
    .querySelectorAll(".category-button")
    .forEach(
        button => {
            button.classList.toggle(
                "active",
                button.dataset.category === activeCategory
            );
        }
    );

    if (categoryText[activeCategory]) {
        title.textContent = categoryText[activeCategory][0];
    }

    const keyword =
        searchKeyword.trim().toLowerCase();

    const filtered =
        allProducts.filter(product => {

            const categoryOK =
                activeCategory === "all"
                ||
                product.category === activeCategory;

            const searchText = [
                product.name,
                product.short_description,
                product.description,
                categoryName(product.category)
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            const searchOK =
                !keyword
                ||
                searchText.includes(keyword);

            return categoryOK && searchOK;
        });

    renderProducts(filtered);
}


function renderProducts(products) {

    productGrid.innerHTML = "";

    if (!products.length) {

        productGrid.innerHTML = `
            <div class="empty-box">
                ${
                    searchKeyword.trim()
                    ? "找不到符合搜尋條件的商品"
                    : "此分類目前尚未新增商品"
                }
            </div>
        `;

        return;
    }

    products.forEach(product => {

        const card =
            document.createElement("article");

        card.className = "product-card";
        card.dataset.productId = product.id;
        card.setAttribute("tabindex", "0");
        card.setAttribute("role", "button");
        card.setAttribute(
            "aria-label",
            "查看 " + (product.name || "商品")
        );

        const image =
            product.image_urls &&
            product.image_urls.length
            ?
            product.image_urls[0]
            :
            "";

        card.innerHTML = `

            <div class="product-image">

                ${
                    image
                    ?
                    `
                    <img
                        src="${escapeAttribute(image)}"
                        alt="${escapeAttribute(product.name)}">
                    `
                    :
                    `
                    <div style="color:#999;text-align:center;">
                        尚無商品圖片
                    </div>
                    `
                }

            </div>

            <div class="product-content">

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

            </div>
        `;

        card.addEventListener(
            "click",
            () => openProduct(product.id)
        );

        card.addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Enter"
                    ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    openProduct(product.id);
                }
            }
        );

        productGrid.appendChild(card);
    });
}



function buildVariantTable(variants) {

    if (
        !Array.isArray(variants)
        ||
        !variants.length
    ) {
        return "";
    }

    const specNames = [];

    variants.forEach(
        variant => {

            const specs =
                Array.isArray(variant.specs)
                ?
                variant.specs
                :
                [];

            specs.forEach(
                spec => {

                    if (
                        spec.name
                        &&
                        !specNames.includes(spec.name)
                    ) {
                        specNames.push(spec.name);
                    }
                }
            );
        }
    );

    if (!specNames.length) {
        return "";
    }

    const header = `

        <tr>

            <th>
                型號
            </th>

            ${
                specNames
                .map(
                    name => `
                    <th>
                        ${escapeHTML(name)}
                    </th>
                    `
                )
                .join("")
            }

        </tr>

    `;

    const rows =
        variants
        .map(
            variant => {

                const map = {};

                (variant.specs || [])
                .forEach(
                    spec => {

                        if (spec.name) {
                            map[spec.name] =
                                spec.value || "";
                        }
                    }
                );

                return `

                    <tr>

                        <td class="variant-model">
                            ${escapeHTML(
                                variant.model || "未命名型號"
                            )}
                        </td>

                        ${
                            specNames
                            .map(
                                name => `
                                <td>
                                    ${
                                        map[name]
                                        ?
                                        escapeHTML(map[name])
                                        :
                                        "—"
                                    }
                                </td>
                                `
                            )
                            .join("")
                        }

                    </tr>

                `;
            }
        )
        .join("");

    return `

        <div class="variant-table-wrap">

            <table class="variant-table">

                <thead>
                    ${header}
                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

        <div class="variant-note">
            不同型號／尺寸可能有不同規格，實際供應狀況歡迎洽詢。
        </div>

    `;
}



function parseSubsidy(value) {
    if (!value) {
        return {
            long_term_care: "",
            disability: ""
        };
    }

    if (typeof value === "object") {
        return {
            long_term_care: value.long_term_care || "",
            disability: value.disability || ""
        };
    }

    try {
        const parsed = JSON.parse(value);

        if (parsed && typeof parsed === "object") {
            return {
                long_term_care: parsed.long_term_care || "",
                disability: parsed.disability || ""
            };
        }
    } catch (error) {
        // 舊資料：尚未拆分的補助內容先視為長照補助，避免資料消失
    }

    return {
        long_term_care: String(value),
        disability: ""
    };
}


function openProduct(id) {

    const product =
        allProducts.find(
            item => item.id === id
        );

    if (!product) {
        return;
    }

    const subsidyData = parseSubsidy(product.subsidy);

    const images =
        Array.isArray(product.image_urls)
        ?
        product.image_urls
        :
        [];

    const specs =
        Array.isArray(product.specs)
        ?
        product.specs
        :
        [];

    const variants =
        Array.isArray(product.variants)
        ?
        product.variants
        :
        [];

    modalImages = images;
    modalImageIndex = 0;

    const firstImage =
        images.length
        ?
        images[0]
        :
        "";

    modalContent.innerHTML = `

        <div class="modal-top">

            <div>

                <div class="main-photo">

                    ${
                        firstImage
                        ?
                        `
                        <img
                            id="mainPhotoImage"
                            src="${escapeAttribute(firstImage)}"
                            alt="${escapeAttribute(product.name)}">

                        ${
                            images.length > 1
                            ?
                            `
                            <button
                                class="photo-arrow prev"
                                id="photoPrev"
                                type="button"
                                aria-label="上一張圖片">
                                ‹
                            </button>

                            <button
                                class="photo-arrow next"
                                id="photoNext"
                                type="button"
                                aria-label="下一張圖片">
                                ›
                            </button>
                            `
                            :
                            ""
                        }
                        `
                        :
                        `
                        <div style="color:#999;">
                            尚無商品圖片
                        </div>
                        `
                    }

                </div>

                ${
                    images.length > 1
                    ?
                    `
                    <div class="thumbnail-list">

                        ${
                            images
                            .map(
                                (image,index) => `
                                <button
                                    class="thumbnail ${index === 0 ? "active" : ""}"
                                    data-index="${index}"
                                    data-image="${escapeAttribute(image)}">

                                    <img
                                        src="${escapeAttribute(image)}"
                                        alt="">

                                </button>
                                `
                            )
                            .join("")
                        }

                    </div>
                    `
                    :
                    ""
                }

            </div>


            <div class="modal-info">

                <span class="modal-category">
                    ${escapeHTML(categoryName(product.category))}
                </span>

                <h2>
                    ${escapeHTML(product.name)}
                </h2>

                <div class="modal-description">
                    ${
                        escapeHTML(
                            product.description
                            ||
                            product.short_description
                            ||
                            ""
                        )
                    }
                </div>

                ${
                    subsidyData.long_term_care
                    ?
                    `
                    <div class="modal-subsidy">
                        <strong>長照補助：</strong>
                        ${escapeHTML(subsidyData.long_term_care)}
                    </div>
                    `
                    :
                    ""
                }

                ${
                    subsidyData.disability
                    ?
                    `
                    <div class="modal-subsidy">
                        <strong>身障補助：</strong>
                        ${escapeHTML(subsidyData.disability)}
                    </div>
                    `
                    :
                    ""
                }

            </div>

        </div>


        ${
            variants.length
            ?
            `
            <section class="detail-section">

                <h3>
                    型號／尺寸規格
                </h3>

                ${buildVariantTable(variants)}

            </section>
            `
            :
            ""
        }


        ${
            specs.length
            ?
            `
            <section class="detail-section">

                <h3>
                    ${variants.length ? "共通規格" : "產品規格"}
                </h3>

                <table class="spec-table">

                    <tbody>

                        ${
                            specs
                            .map(
                                spec => `
                                <tr>
                                    <th>
                                        ${escapeHTML(spec.name)}
                                    </th>
                                    <td>
                                        ${escapeHTML(spec.value)}
                                    </td>
                                </tr>
                                `
                            )
                            .join("")
                        }

                    </tbody>

                </table>

            </section>
            `
            :
            ""
        }

    `;

    modal.classList.add("show");
    document.body.classList.add("modal-open");

    function showModalImage(index) {

        if (!modalImages.length) {
            return;
        }

        modalImageIndex =
            (index + modalImages.length)
            %
            modalImages.length;

        const mainImage =
            document.getElementById("mainPhotoImage");

        if (mainImage) {
            mainImage.src =
                modalImages[modalImageIndex];
        }

        document
        .querySelectorAll(".thumbnail")
        .forEach(
            (item,index) => {
                item.classList.toggle(
                    "active",
                    index === modalImageIndex
                );
            }
        );
    }

    document
    .querySelectorAll(".thumbnail")
    .forEach(
        thumbnail => {

            thumbnail.addEventListener(
                "click",
                function () {

                    showModalImage(
                        Number(thumbnail.dataset.index)
                    );
                }
            );
        }
    );

    const prev =
        document.getElementById("photoPrev");

    const next =
        document.getElementById("photoNext");

    if (prev) {
        prev.addEventListener(
            "click",
            () => showModalImage(modalImageIndex - 1)
        );
    }

    if (next) {
        next.addEventListener(
            "click",
            () => showModalImage(modalImageIndex + 1)
        );
    }
}


function closeModal() {

    modal.classList.remove("show");
    document.body.classList.remove("modal-open");
}


document
.getElementById("modalClose")
.addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    function (event) {

        if (event.target === modal) {
            closeModal();
        }
    }
);


document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {
            closeModal();
        }
    }
);


const productSearch =
    document.getElementById("productSearch");

if (productSearch) {

    productSearch.addEventListener(
        "input",
        function () {

            searchKeyword =
                productSearch.value || "";

            filterProducts(activeCategory);
        }
    );
}


document
.querySelectorAll(".category-button")
.forEach(
    button => {

        button.addEventListener(
            "click",
            function () {

                const category =
                    button.dataset.category;

                filterProducts(category);

                const newUrl =
                    category === "all"
                    ?
                    "products.html"
                    :
                    "products.html?category="
                    +
                    encodeURIComponent(category);

                history.replaceState(
                    null,
                    "",
                    newUrl
                );
            }
        );
    }
);


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;
}


function escapeAttribute(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
