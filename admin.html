<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f5f8fa;color:#263238}button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#075b82,#079bd8);padding:24px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.12)}.login-box{width:min(430px,100%);padding:36px}h1,h2,h3{color:#164c65}
.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #d6e1e6;border-radius:8px}textarea{min-height:100px;resize:vertical}
.primary{border:0;background:#0797d3;color:#fff;border-radius:8px;padding:11px 18px;font-weight:700}.full{width:100%}.error{color:#bd2d2d;margin-top:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);gap:12px}header strong{color:#0797d3;font-size:20px}
.header-actions{display:flex;gap:8px}.header-actions a,.header-actions button{padding:9px 13px;border:1px solid #d9e3e7;border-radius:7px;background:#fff;text-decoration:none;color:#333}
main{width:92%;max-width:1280px;margin:32px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.table-wrap{overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.05)}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #edf1f3;text-align:left}th{background:#f8fafb;color:#607d8b}
.thumb{width:64px;height:64px;object-fit:contain;background:#f7f9fa;border-radius:7px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 9px;border:1px solid #d9e3e7;background:#fff;border-radius:6px}
.editor{margin-top:24px;padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.span2{grid-column:1/-1}.checks{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0}.checks label{display:flex;gap:7px;align-items:center;font-weight:400}.checks input{width:auto}
.section{border-top:1px solid #e8edef;margin-top:24px;padding-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.soft{border:0;background:#e8f7fc;color:#0797d3;border-radius:7px;padding:8px 12px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}.row1{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.remove{border:0;background:#fff0ee;color:#b32a1f;border-radius:7px;padding:8px 10px}
.previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.preview{width:110px;height:110px;position:relative;border:1px solid #dfe7ea;border-radius:8px;overflow:hidden;background:#f8fafb}.preview img{width:100%;height:100%;object-fit:contain}.preview button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:25px;height:25px;background:#0009;color:white}
.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#eee}.on{background:#e5f6ec;color:#19734a}.hot{color:#d35400;font-weight:700}.sort-note{margin:10px 0 16px;color:#607d8b;font-size:14px}tbody tr[draggable="true"]{cursor:grab}tbody tr.dragging{opacity:.4;background:#eef8fc}.sort-badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;padding:0 8px;border-radius:999px;background:#e8f7fc;color:#176182;font-weight:700}
.msg{margin-top:12px;color:#176182}
.variant-card{margin:14px 0;padding:18px;border:1px solid #dce7eb;border-radius:12px;background:#f8fbfc}
.variant-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:12px}
.variant-specs{margin-top:8px}
.variant-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.copy-variant{border:0;background:#eef7fb;color:#176182;border-radius:7px;padding:8px 12px;font-weight:700}
.copy-variant:hover{background:#dff1f8}
@media(max-width:760px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.row2,.row1{grid-template-columns:1fr}header,.top{align-items:flex-start;flex-direction:column}}

.filters{
  display:grid;
  grid-template-columns:minmax(260px,1fr) 230px;
  gap:12px;
  margin:0 0 16px;
}
.filters input,.filters select{background:#fff}

.image-note{width:110px;margin-top:7px;padding:7px 8px;border:1px solid #dfe7ea;border-radius:7px;font-size:13px;background:#fff}
.preview{height:auto!important;overflow:visible!important;background:transparent!important;border:0!important}

.preview .image-box img{width:100%;height:100%;object-fit:contain}
.preview .image-box button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:25px;height:25px;background:#0009;color:white}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://sdkgiedglmhmchiietru.supabase.co";
const SUPABASE_KEY="sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let images=[];
let originalImages=[];
let productsCache=[];
let draggedRow=null;

async function isAdmin(){
const {data,error}=await db.rpc("is_admin");
return !error && data===true;
}
async function boot(){
const {data}=await db.auth.getSession();
if(data.session && await isAdmin()) showAdmin(); else showLogin();
}
function showLogin(msg=""){$("loginPage").classList.remove("hidden");$("adminPage").classList.add("hidden");$("loginMsg").textContent=msg}
function showAdmin(){$("loginPage").classList.add("hidden");$("adminPage").classList.remove("hidden");load()}

$("loginBtn").onclick=async()=>{
$("loginMsg").textContent="登入中...";
const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
if(error) return showLogin("登入失敗："+error.message);
if(!(await isAdmin())){await db.auth.signOut();return showLogin("此帳號沒有管理員權限")}
showAdmin();
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").onclick=async()=>{await db.auth.signOut();showLogin()};

$("productSearch").addEventListener("input",renderProductTable);
$("categoryFilter").addEventListener("change",renderProductTable);


const cname=c=>({"aluminum-wheelchair":"鋁製輪椅","steel-wheelchair":"鐵製輪椅","rollator":"助步車","commode-chair":"便椅","shower-chair":"洗澡椅","walker":"助行器","cane-crutch":"手／拐杖","quad-cane":"四腳拐","accessories":"輔助用品"}[c]||c);
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function parseSubsidy(value){
  if(!value)return {long_term_care:"",disability:""};
  if(typeof value==="object"){
    return {
      long_term_care:value.long_term_care||"",
      disability:value.disability||""
    };
  }
  try{
    const obj=JSON.parse(value);
    if(obj && typeof obj==="object"){
      return {
        long_term_care:obj.long_term_care||"",
        disability:obj.disability||""
      };
    }
  }catch(e){}
  /* 舊資料尚未拆分時，先保留在長照補助，避免內容消失 */
  return {long_term_care:String(value),disability:""};
}
function buildSubsidy(){
  return JSON.stringify({
    long_term_care:$("ltcSubsidy").value.trim(),
    disability:$("disabilitySubsidy").value.trim()
  });
}


async function load(){
$("tbody").innerHTML='<tr><td colspan="6">載入中...</td></tr>';
const {data,error}=await db.from("products").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true});
if(error)return $("tbody").innerHTML='<tr><td colspan="6">讀取失敗：'+esc(error.message)+'</td></tr>';
productsCache=data||[];
renderProductTable();
}

function renderProductTable(){
 const keyword=($("productSearch")?.value||"").trim().toLowerCase();
 const category=$("categoryFilter")?.value||"all";

 const filtered=productsCache.filter(p=>{
   const matchName=!keyword || String(p.name||"").toLowerCase().includes(keyword);
   const matchCategory=category==="all" || p.category===category;
   return matchName && matchCategory;
 });

 $("filterCount").textContent=`顯示 ${filtered.length} / ${productsCache.length} 件商品`;
 $("tbody").innerHTML=filtered.length?"":'<tr><td colspan="6">找不到符合條件的商品</td></tr>';

 filtered.forEach((p,index)=>{
   const tr=document.createElement("tr"),img=p.image_urls?.[0]||"";
   tr.draggable=true;
   tr.dataset.id=p.id;
   tr.innerHTML=`<td><span class="sort-badge">${Number(p.sort_order)||index+1}</span></td><td>${img?`<img class="thumb" src="${esc(img)}">`:"無圖片"}</td><td>${esc(p.name)}</td><td>${cname(p.category)}</td><td><span class="status ${p.is_active?"on":""}">${p.is_active?"上架":"下架"}</span></td><td><div class="actions"><button data-e="${p.id}">編輯</button><button data-d="${p.id}">刪除</button></div></td>`;
   $("tbody").appendChild(tr);
 });

 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(b.dataset.d));

 /* 篩選中不啟用拖曳，避免只對部分商品重排造成順序混亂 */
 if(!keyword && category==="all"){
   setupDragSort();
 }else{
   [...$("tbody").querySelectorAll("tr[data-id]")].forEach(row=>row.draggable=false);
 }
}

function setupDragSort(){
 const body=$("tbody");
 [...body.querySelectorAll('tr[draggable="true"]')].forEach(row=>{
  row.addEventListener("dragstart",()=>{draggedRow=row;row.classList.add("dragging")});
  row.addEventListener("dragend",async()=>{
   row.classList.remove("dragging");
   if(!draggedRow)return;
   draggedRow=null;
   await saveOrder([...body.querySelectorAll("tr[data-id]")].map(r=>r.dataset.id));
  });
  row.addEventListener("dragover",e=>{
   e.preventDefault();
   if(!draggedRow||draggedRow===row)return;
   const r=row.getBoundingClientRect();
   if(e.clientY>r.top+r.height/2)row.after(draggedRow);else row.before(draggedRow);
   if(e.clientY<90)window.scrollBy(0,-18);
   else if(window.innerHeight-e.clientY<90)window.scrollBy(0,18);
  });
 });
}

async function saveOrder(ids){
 try{
  for(let i=0;i<ids.length;i++){
   const {error}=await db.from("products").update({sort_order:i+1}).eq("id",ids[i]);
   if(error)throw error;
  }
  await load();
 }catch(e){alert("排序儲存失敗："+e.message);await load()}
}

async function applyManualOrder(id,desired){
 desired=Math.max(1,Number(desired)||1);
 const {data,error}=await db.from("products").select("id,sort_order,created_at").order("sort_order",{ascending:true}).order("created_at",{ascending:true});
 if(error)throw error;
 const others=(data||[]).filter(p=>String(p.id)!==String(id));
 desired=Math.min(desired,others.length+1);
 const ids=others.map(p=>p.id);ids.splice(desired-1,0,id);
 for(let i=0;i<ids.length;i++){
  const {error:e}=await db.from("products").update({sort_order:i+1}).eq("id",ids[i]);
  if(e)throw e;
 }
}

async function nextSortOrder(){
 const {data,error}=await db.from("products").select("sort_order").order("sort_order",{ascending:false}).limit(1);
 return (!error&&data?.length)?(Number(data[0].sort_order)||0)+1:1;
}


function addSpec(n="",v=""){
const r=document.createElement("div");r.className="row2";
r.innerHTML='<input class="sn" placeholder="規格名稱，例如：座寬"><input class="sv" placeholder="例如：45 cm"><button class="remove">刪除</button>';
r.querySelector(".sn").value=n;r.querySelector(".sv").value=v;r.querySelector("button").onclick=()=>r.remove();$("specs").appendChild(r);
}

function addVariantSpec(container,n="",v=""){
const r=document.createElement("div");r.className="row2 variant-spec-row";
r.innerHTML='<input class="vsn" placeholder="規格名稱，例如：座寬"><input class="vsv" placeholder="例如：42cm"><button type="button" class="remove">刪除</button>';
r.querySelector(".vsn").value=n;
r.querySelector(".vsv").value=v;
r.querySelector(".remove").onclick=()=>r.remove();
container.appendChild(r);
}

function addVariant(model="",specs=null){
const card=document.createElement("div");
card.className="variant-card";
card.innerHTML=`
   <div class="variant-top">
     <div class="field" style="margin:0">
       <label>型號／尺寸名稱</label>
       <input class="variant-model" placeholder="例如：AC1616">
     </div>
     <button type="button" class="remove remove-variant">刪除此型號</button>
   </div>
   <div><strong style="color:#164c65">此型號規格</strong></div>
   <div class="variant-specs"></div>
   <div class="variant-actions">
     <button type="button" class="soft add-variant-spec">＋ 新增規格</button>
     <button type="button" class="copy-variant duplicate-variant">複製此型號</button>
   </div>`;
card.querySelector(".variant-model").value=model;
const box=card.querySelector(".variant-specs");
card.querySelector(".add-variant-spec").onclick=()=>addVariantSpec(box);
card.querySelector(".remove-variant").onclick=()=>card.remove();
card.querySelector(".duplicate-variant").onclick=()=>{
const currentModel=card.querySelector(".variant-model").value.trim();
const currentSpecs=[...card.querySelectorAll(".variant-spec-row")].map(r=>({
name:r.querySelector(".vsn").value.trim(),
value:r.querySelector(".vsv").value.trim()
}));
addVariant(currentModel ? currentModel + "-copy" : "", currentSpecs);
};
$("variants").appendChild(card);

if(Array.isArray(specs) && specs.length){
specs.forEach(s=>addVariantSpec(box,s.name||"",s.value||""));
}else{
["座寬","座深","座高","總寬","總高","總長","承重","淨重"].forEach(n=>addVariantSpec(box,n,""));
}
}

function getVariants(){
return [...document.querySelectorAll(".variant-card")].map(card=>{
const model=card.querySelector(".variant-model").value.trim();
const specs=[...card.querySelectorAll(".variant-spec-row")].map(r=>({
name:r.querySelector(".vsn").value.trim(),
value:r.querySelector(".vsv").value.trim()
})).filter(s=>s.name&&s.value);
return {model,specs};
}).filter(v=>v.model || v.specs.length);
}

function addVariantLikeFirst(){
const first=$("variants").querySelector(".variant-card");
if(!first){
addVariant();
return;
}

const specs=[...first.querySelectorAll(".variant-spec-row")].map(r=>({
name:r.querySelector(".vsn").value.trim(),
value:r.querySelector(".vsv").value.trim()
}));

addVariant("",specs);
}
$("addSpec").onclick=()=>addSpec();
$("addVariant").onclick=()=>addVariant();
$("addVariantLikeFirst").onclick=()=>addVariantLikeFirst();

function defaults(){
  ["座寬","座深","座高","總寬","總高","總長","淨重"].forEach(n=>addSpec(n,""));
}
function storagePathFromUrl(url){
 const marker="/storage/v1/object/public/product-images/";
 const i=(url||"").indexOf(marker);
 if(i<0)return null;
 try{return decodeURIComponent(url.slice(i+marker.length))}catch{return url.slice(i+marker.length)}
}
async function deleteStorageUrlsIfUnused(urls){
 const unique=[...new Set((urls||[]).filter(Boolean))];
 if(!unique.length)return;
 const {data,error}=await db.from("products").select("image_urls");
 if(error)throw error;
 const used=new Set();
 (data||[]).forEach(p=>(p.image_urls||[]).forEach(u=>used.add(u)));
 const paths=unique.filter(u=>!used.has(u)).map(storagePathFromUrl).filter(Boolean);
 if(paths.length){
  const {error:e}=await db.storage.from("product-images").remove(paths);
  if(e)throw e;
 }
}

function renderImages(){
$("previews").innerHTML="";
images.forEach((u,i)=>{
const d=document.createElement("div");d.className="preview";
d.innerHTML=`<div class="image-box"><img src="${esc(u)}"><button type="button">×</button></div><input class="image-note" type="text" placeholder="圖片備註，例如：粉色" value="${esc(imageNotes[i]||"")}">`;
d.querySelector("button").onclick=()=>{images.splice(i,1);imageNotes.splice(i,1);renderImages()};
d.querySelector(".image-note").addEventListener("input",e=>{imageNotes[i]=e.target.value});
$("previews").appendChild(d);
});
}
async function upload(){
for(const f of Array.from($("files").files)){
const ext=(f.name.split(".").pop()||"jpg").toLowerCase();
const path="products/"+crypto.randomUUID()+"."+ext;
const {error}=await db.storage.from("product-images").upload(path,f);
if(error) throw error;
images.push(db.storage.from("product-images").getPublicUrl(path).data.publicUrl);imageNotes.push("");
}
$("files").value="";
}

async function reset(useDefaults=true){
  ["id","name","desc","ltcSubsidy","disabilitySubsidy"].forEach(x=>$(x).value="");
  $("category").value="aluminum-wheelchair";
  $("sort").value=await nextSortOrder();
  $("active").checked=true;
  $("specs").innerHTML="";$("variants").innerHTML="";
  images=[];imageNotes=[];originalImages=[];renderImages();$("saveMsg").textContent="";
  if(useDefaults)defaults();
}
$("newBtn").onclick=async()=>{await reset();$("editorTitle").textContent="新增商品";$("editor").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"})};
$("closeBtn").onclick=()=>$("editor").classList.add("hidden");

$("saveBtn").onclick=async()=>{
const btn=$("saveBtn");btn.disabled=true;btn.textContent="儲存中...";$("saveMsg").textContent="";
try{
 await upload();
 const name=$("name").value.trim();if(!name)throw new Error("請輸入商品名稱");
 const specs=[...$("specs").querySelectorAll(".row2")].map(r=>({name:r.querySelector(".sn").value.trim(),value:r.querySelector(".sv").value.trim()})).filter(x=>x.name&&x.value);
 const variants=getVariants();
 const desired=Math.max(1,Number($("sort").value)||1);
 const editingId=$("id").value;
 const imageNoteMeta="__IMAGE_NOTES__"+JSON.stringify(imageNotes);
const item={name,category:$("category").value,description:$("desc").value.trim(),subsidy:buildSubsidy(),sort_order:desired,is_active:$("active").checked,features:[imageNoteMeta],specs,variants,image_urls:images};
 let savedId=editingId;
 if(editingId){
  const {error}=await db.from("products").update(item).eq("id",editingId);if(error)throw error;
 }else{
  item.slug=(name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"product")+"-"+Date.now();
  const {data,error}=await db.from("products").insert(item).select("id").single();if(error)throw error;savedId=data.id;
 }
 await applyManualOrder(savedId,desired);
 if(editingId){
  const now=new Set(images),removed=originalImages.filter(u=>!now.has(u));
  if(removed.length){try{await deleteStorageUrlsIfUnused(removed)}catch(e){console.error(e);alert("商品已儲存，但舊圖片未能從 Storage 完全刪除，請檢查 DELETE 權限。")}}
 }
 $("saveMsg").textContent="商品已成功儲存";await load();setTimeout(()=>$("editor").classList.add("hidden"),600);
}catch(e){$("saveMsg").textContent="儲存失敗："+e.message}
finally{btn.disabled=false;btn.textContent="儲存商品"}
};

async function edit(id){
const {data,error}=await db.from("products").select("*").eq("id",id).single();
if(error)return alert("讀取商品失敗："+error.message);
await reset(false);
$("id").value=data.id;$("name").value=data.name||"";$("category").value=data.category||"aluminum-wheelchair";
$("desc").value=data.description||"";
const subsidyData=parseSubsidy(data.subsidy);
$("ltcSubsidy").value=subsidyData.long_term_care;
$("disabilitySubsidy").value=subsidyData.disability;
$("sort").value=data.sort_order||1;$("active").checked=!!data.is_active;
images=[...(data.image_urls||[])];originalImages=[...(data.image_urls||[])];renderImages();
(data.specs||[]).forEach(s=>addSpec(s.name,s.value));(data.variants||[]).forEach(v=>addVariant(v.model||"",v.specs||[]));
$("editorTitle").textContent="編輯商品";$("editor").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"});
}

async function del(id){
if(!confirm("確定要刪除這件商品嗎？未被其他商品使用的圖片也會同步刪除。"))return;
const {data:p,error:rerr}=await db.from("products").select("image_urls").eq("id",id).single();
if(rerr)return alert("讀取商品失敗："+rerr.message);
const old=[...(p?.image_urls||[])];
const {error}=await db.from("products").delete().eq("id",id);
if(error)return alert("刪除失敗："+error.message);
try{await deleteStorageUrlsIfUnused(old)}catch(e){console.error(e);alert("商品已刪除，但 Storage 圖片未完全刪除，請檢查 DELETE 權限。")}
const {data:remain}=await db.from("products").select("id,sort_order,created_at").order("sort_order",{ascending:true}).order("created_at",{ascending:true});
if(remain)for(let i=0;i<remain.length;i++)await db.from("products").update({sort_order:i+1}).eq("id",remain[i].id);
await load();
}

boot();
</script>
</body>
</html>
